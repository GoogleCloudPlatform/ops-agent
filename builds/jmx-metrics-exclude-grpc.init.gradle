// Gradle init script used when building the jmx-metrics jar from
// submodules/opentelemetry-java-contrib.
//
// jmx-metrics declares io.grpc:grpc-netty-shaded but never uses it (upstream
// dropped it as unused in opentelemetry-java-contrib#1905). It is the only
// path that bundles Guava into the jar, so excluding it removes Guava without
// moving the submodule pin and without changing any collected metric.
allprojects {
  if (name == "jmx-metrics") {
    configurations.matching { it.name in ["compileClasspath", "runtimeClasspath"] }.configureEach {
      exclude group: "io.grpc", module: "grpc-netty-shaded"
    }
  }
}
